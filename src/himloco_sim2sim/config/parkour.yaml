# HIMGo2WParkourCfg / model_13500.pt；三处站姿必须一致。
# himloco_policy: RL 动作基准与 PD；robot_ctrl: Stand 基准与 PD；go2w_mujoco: 初始姿态。
# 更换权重时要按训练配置同步修改，不能只根据模型文件名猜参数。
himloco_policy:
  ros__parameters:
    default_position: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0,
                       0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
    leg_kp: 40.0
    leg_kd: 1.0
    wheel_kd: 0.5
robot_ctrl:
  ros__parameters:
    default_position: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0,
                       0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
    leg_kp: 40.0
    leg_kd: 1.0
    wheel_kd: 0.5
go2w_mujoco:
  ros__parameters:
    default_position: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0,
                       0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
    initial_height: 0.45
