himloco_policy:
  ros__parameters:
    policy_period: 0.02  # 训练 sim.dt=0.005, decimation=4。
    history_length: 6
    default_position: [0.1, 0.8, -1.5, 0.0, -0.1, 0.8, -1.5, 0.0,
                       0.1, 1.0, -1.5, 0.0, -0.1, 1.0, -1.5, 0.0]
    # 训练观测归一化，不是速度上限；改变它会改变策略对相同物理输入的解释。
    command_scale: [2.0, 2.0, 0.25]
    angular_velocity_scale: 0.25
    joint_position_scale: 1.0
    joint_velocity_scale: 0.05
    clip_observations: 100.0
    clip_actions: 100.0
    leg_action_scale: 0.25  # 腿目标 = 默认角度 + action*此值，rad。
    wheel_action_scale: 10.0  # 轮目标角速度 = action*此值，rad/s；不是车体 m/s。
    # 本文件为 flat 基础值，launch 后加载 parkour.yaml/flat.yaml 覆盖对应字段。
    # 此处/对应 profile 中的 PD 写入每条 RL 指令；控制器站立 PD 不会覆盖它。
    leg_kp: 20.0
    leg_kd: 0.5
    wheel_kd: 0.3
    wheel_velocity_limit: 100.0
    state_timeout: 0.1
    command_timeout: 0.5  # 期望速度断流则归零，继续 RL；不是电机指令失效阈值。
    velocity_topic: /cmd_vel
    autostart: false
    stand_wait: 1.7
